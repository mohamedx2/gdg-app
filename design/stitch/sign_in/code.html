<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_auth" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>

"lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md min-h-screen flex flex-col antialiased"><header class="fixed top-0 inset-x-0 z-50 pt-safe bg-surface-container-lowest/80 backdrop-blur-xl"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] -ml-space-xs flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><div class="flex items-center gap-space-xs"><span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span><span class="w-1.5 h-1.5 rounded-full bg-tertiary-container"></span><span class="w-1.5 h-1.5 rounded-full bg-secondary-container"></span><span class="w-1.5 h-1.5 rounded-full bg-primary"></span></div><a class="min-w-[44px] min-h-[44px] flex items-center justify-end font-label-code text-label-code text-on-surface-variant hover:text-primary transition-colors" data-path="welcome-onboarding" href="#">Skip</a></div></header><main class="flex-1 flex flex-col w-full pt-14 pb-safe bg-surface-container-lowest px-margin"><div class="flex flex-col w-full pb-6 space-y-6">
<!-- Brand Framing & Header -->
<div class="flex flex-col items-center text-center pt-2">
<!-- Chapter Pill Badge -->
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-high shadow-sm mb-4">
<div class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
<span class="w-1.5 h-1.5 rounded-full bg-tertiary-container"></span>
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container"></span>
<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
</div>
<span class="font-label-code text-label-tag text-on-surface-variant uppercase tracking-wider">GDG on Campus EPI</span>
</div>
<!-- Title & Welcoming Pitch -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2 tracking-tight">
      Welcome back, builder
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
      Sign in to access your squad XP, hackathon tickets, and community votes.
    </p>
</div>
<!-- Sign In Form Container -->
<div class="flex flex-col w-full space-y-4">
<!-- Google Auth Button (Outlined via Surface Shift) -->
<button class="group relative w-full h-12 px-4 rounded-xl bg-surface-container-high hover:bg-surface-bright active:scale-[0.99] transition-all flex items-center justify-center gap-3 shadow-sm" type="button">
<svg class="w-5 h-5 flex-shrink-0" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-headline-sm text-body-lg text-on-surface font-semibold tracking-tight">
        Continue with Google
      </span>
</button>
<!-- Structural Minimal Divider -->
<div class="relative flex items-center justify-center py-2">
<div class="w-full h-px bg-surface-container-highest"></div>
<span class="absolute px-3 bg-surface-container-lowest font-label-code text-label-tag text-outline tracking-wider uppercase">
        or continue with email
      </span>
</div>
<!-- Credentials Form -->
<form class="flex flex-col space-y-4" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-code text-label-code text-on-surface-variant flex items-center justify-between" for="email">
<span>Student or Personal Email</span>
<span class="text-outline text-body-sm font-body-sm">EPI ID / Gmail</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-3.5 pointer-events-none text-outline flex items-center justify-center">
<span class="material-symbols-outlined text-[19px]">mail</span>
</div>
<input class="w-full h-12 pl-11 pr-4 rounded-xl bg-surface-container-low text-on-surface placeholder:text-outline/60 font-body-md text-body-md focus:bg-surface-container focus:outline-none transition-colors shadow-inner" id="email" placeholder="e.g. ahmed@epi.tn or gmail.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-code text-label-code text-on-surface-variant" for="password">Password</label>
<a class="font-label-code text-label-code text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<div class="absolute left-3.5 pointer-events-none text-outline flex items-center justify-center">
<span class="material-symbols-outlined text-[19px]">lock</span>
</div>
<input class="w-full h-12 pl-11 pr-11 rounded-xl bg-surface-container-low text-on-surface placeholder:text-outline/60 font-body-md text-body-md tracking-wider focus:bg-surface-container focus:outline-none transition-colors shadow-inner" id="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-on-surface transition-colors p-1" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[19px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center justify-between pt-1 pb-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input checked="" class="sr-only peer" id="rememberDevice" type="checkbox"/>
<div class="w-5 h-5 rounded-lg bg-surface-container-high peer-checked:bg-primary-container flex items-center justify-center transition-all shadow-sm">
<span class="material-symbols-outlined text-[15px] text-on-primary-container opacity-0 peer-checked:opacity-100 transition-opacity font-bold">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">Keep me signed in on this device</span>
</label>
</div>
<!-- Submit CTA Button -->
<button class="w-full h-12 mt-2 rounded-xl bg-primary-container text-on-primary font-headline-sm text-body-lg font-bold flex items-center justify-center gap-2 shadow-lg hover:brightness-110 active:scale-[0.98] transition-all" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Sign Up Link -->
<div class="flex items-center justify-center text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      New to GDG on Campus EPI? 
      <a class="text-primary font-semibold hover:underline transition-all" href="#">Create an account</a>
</p>
</div>
<!-- Campus Community & Security Telemetry -->
<div class="flex flex-col items-center justify-center pt-2 space-y-2">
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low text-outline font-label-code text-label-tag">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="tracking-wide">Secured with Firebase Auth • EPI Campus Network</span>
</div>
</div>
</div>
<script>
  // Simple micro-interaction for password toggle
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }
</script></main></body></html>
